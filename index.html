<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tiny Town: build your own cosy dream town</title>
    <meta name="description" content="A cosy city-builder sandbox in your browser. Lay roads, build homes and shops, plant gardens and watch day turn to night. No goals, no timers. Free, and it works on phones." />
    <meta name="author" content="Nazarii Taran" />
    <link rel="canonical" href="https://tiny-town-threejs-game.pages.dev/" />
    <meta name="theme-color" content="#bfe3ff" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tiny Town" />
    <meta property="og:title" content="Tiny Town: build your own cosy dream town" />
    <meta property="og:description" content="A cosy city-builder sandbox in your browser. No goals, no timers." />
    <meta property="og:url" content="https://tiny-town-threejs-game.pages.dev/" />
    <meta property="og:image" content="https://tiny-town-threejs-game.pages.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A small town at golden hour: a roundabout, homes, a church and a donut shop" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@tn255" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Tiny Town",
        "description": "A cosy city-builder sandbox that runs in the browser.",
        "url": "https://tiny-town-threejs-game.pages.dev/",
        "image": "https://tiny-town-threejs-game.pages.dev/og-image.jpg",
        "genre": ["City builder", "Sandbox"],
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "author": { "@type": "Person", "name": "Nazarii Taran" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Tiny Town 3D view"></canvas>
      <div id="ui-root"></div>
      <noscript>
        <h1>Tiny Town</h1>
        <p>A cosy city-builder sandbox: lay roads, build homes and shops, plant gardens and watch day turn to night. It needs JavaScript and WebGL to run.</p>
      </noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
